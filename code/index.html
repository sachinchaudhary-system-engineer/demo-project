<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>🚀 DevOps CI/CD Pipeline</h1>

    <p class="subtitle">
        Automated deployment using GitHub, Jenkins, Docker & Kubernetes
    </p>

    <div class="cards">

        <div class="card">
            <h2>GitHub</h2>
            <p>Source Code Repository</p>
        </div>

        <div class="card">
            <h2>Jenkins</h2>
            <p>Continuous Integration</p>
        </div>

        <div class="card">
            <h2>Docker</h2>
            <p>Containerized Application</p>
        </div>

        <div class="card">
            <h2>Kubernetes</h2>
            <p>Container Orchestration</p>
        </div>

    </div>

    <button onclick="deploy()">
        Check Deployment
    </button>

    <h2 id="status"></h2>

</div>

<script>

function deploy(){

document.getElementById("status").innerHTML =
"✅ Deployment Successful";

}

</script>

</body>
</html>
