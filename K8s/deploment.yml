apiVersion: apps/v1
kind: Deployment

metadata:
  name: devops-dashboard
  labels:
    app: devops-dashboard

spec:
  replicas: 2

  selector:
    matchLabels:
      app: devops-dashboard

  template:
    metadata:
      labels:
        app: devops-dashboard

    spec:
      containers:
      - name: devops-dashboard

        # Jenkins will update this image
        image: IMAGE_PLACEHOLDER

        imagePullPolicy: Always

        ports:
        - containerPort: 80
