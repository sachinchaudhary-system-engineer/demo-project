apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: java-ingress
  namespace: jenkins

spec:
  ingressClassName: nginx

  rules:
  - host: java.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: java-service
            port:
              number: 80

  - host: web.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-service
            port:
              number: 80
